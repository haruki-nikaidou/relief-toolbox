[workspace]
resolver = "3"
members = ["apps/g_j_elimination","apps/sat_solver"]

[workspace.dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
smallvec = "1.15"
compact_str = { version = "0.9", features = ["serde"] }
serde_json = "1"
num = "0.4"
mathcore = "0.3"
nalgebra = "0.34"
